version: 2

models:
  - name: stg_transactions
    description: Bank export, typed and renamed to snake_case. One row per transaction.
  - name: int_pay_periods
    description: One row per salary month. Period = from the payday (last business day of the previous month) to the day before the next payday. Generated from the rule, not from the data.
  - name: fct_transactions_by_salary_month
    description: Each transaction attached to its calendar month and to its salary month.